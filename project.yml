name: AgentTalk
options:
  bundleIdPrefix: com.agenttalk
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

configs:
  Debug: debug
  Release: release

targets:
  AgentTalk:
    type: application
    platform: macOS
    sources:
      - path: AgentTalk
        type: group
    settings:
      base:
        INFOPLIST_FILE: AgentTalk/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.agenttalk.app
        CODE_SIGN_ENTITLEMENTS: AgentTalk/AgentTalk.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AgentTalk needs microphone access to convert your speech to text. Audio never leaves your device."
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/rust-core/generated"
          - "$(SRCROOT)/AgentTalk/Bridge"
        SWIFT_OBJC_BRIDGING_HEADER: AgentTalk/Bridge/AgentTalk-Bridging-Header.h
        OTHER_LINKER_FLAGS:
          - "-framework Metal"
          - "-framework CoreML"
          - "-framework Accelerate"
          - "-framework AppKit"
          - "-framework AVFoundation"
          - "-framework Carbon"
          - "-framework Security"
      configs:
        Debug:
          OTHER_LDFLAGS: "$(SRCROOT)/rust-core/target/debug/libagent_talk_core.a"
        Release:
          OTHER_LDFLAGS: "$(SRCROOT)/rust-core/target/release/libagent_talk_core.a"
    preBuildScripts:
      - name: "Build Rust Core"
        script: |
          set -e
          cd "$SRCROOT/rust-core"

          if [ "$CONFIGURATION" = "Release" ]; then
            cargo build --release
          else
            cargo build
          fi

          mkdir -p "$SRCROOT/AgentTalk/Bridge"
          cp "$SRCROOT/rust-core/generated/"*.swift "$SRCROOT/AgentTalk/Bridge/" 2>/dev/null || true
          cp "$SRCROOT/rust-core/generated/"*.h "$SRCROOT/AgentTalk/Bridge/" 2>/dev/null || true
          cp "$SRCROOT/rust-core/generated/agent-talk-core/"*.swift "$SRCROOT/AgentTalk/Bridge/" 2>/dev/null || true
          cp "$SRCROOT/rust-core/generated/agent-talk-core/"*.h "$SRCROOT/AgentTalk/Bridge/" 2>/dev/null || true
        basedOnDependencyAnalysis: false
        inputFiles: []
        outputFiles:
          - "$(SRCROOT)/rust-core/target/$(CONFIGURATION_LOWER)/libagent_talk_core.a"
