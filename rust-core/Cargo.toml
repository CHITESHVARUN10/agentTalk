[package]
name = "agent-talk-core"
version = "0.1.0"
edition = "2021"
description = "AgentTalk — AI dictation core (macOS + Windows)"

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
default = ["metal"]
metal = ["whisper-rs/metal"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[dependencies]
whisper-rs = { version = "0.13", default-features = false }
cpal = "0.15"
arboard = "3"
config = { version = "0.14", features = ["toml"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
swift-bridge = "0.1"
core-graphics = "0.23"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices"] }

[build-dependencies]
swift-bridge-build = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
uninlined_format_args = "warn"
manual_string_new = "warn"
unwrap_used = "deny"
expect_used = "deny"
type_complexity = "warn"
too_many_arguments = "warn"
