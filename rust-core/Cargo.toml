[package]
name = "agent-talk-core"
version = "0.1.0"
edition = "2021"
description = "AgentTalk — macOS-native AI dictation core"

[lib]
crate-type = ["staticlib"]

[dependencies]
swift-bridge = "0.1"
whisper-rs = { version = "0.13", features = ["metal"] }
cpal = "0.15"
arboard = "3"
core-graphics = "0.23"
core-foundation = "0.10"
config = { version = "0.14", features = ["toml"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"
dirs = "5"

[build-dependencies]
swift-bridge-build = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
uninlined_format_args = "warn"
manual_string_new = "warn"
unwrap_used = "deny"
expect_used = "deny"
type_complexity = "warn"
too_many_arguments = "warn"
