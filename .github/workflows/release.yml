name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-14
          - arch: x86_64
            runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build
        run: ./scripts/build.sh

      - name: Package DMG
        run: ./scripts/package.sh

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          generate_release_notes: true

  build-windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
            windows/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock', 'windows/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Tauri prerequisites
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo install tauri-cli --locked || true

      - name: Build Rust core (Vulkan)
        run: cargo build --release --features vulkan
        working-directory: rust-core

      - name: Build Tauri app
        run: cargo tauri build
        working-directory: windows/src-tauri

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Package Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName windows/installer/installer.iss

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-x64-setup.exe
          draft: false
          generate_release_notes: true
