<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DictationAI - Transcript</title>

            "error": "#ba1a1a",

            "surface-container-high": "#eae7e7",

            "on-tertiary-fixed-variant": "#7c2e00",
            "secondary-fixed-dim": "#c6c6cb",
            "secondary-fixed": "#e3e2e7",
            "inverse-surface": "#303030",

            "inverse-on-surface": "#f3f0ef",
            "on-surface-variant": "#414755",

            "tertiary-container": "#c64f00",
            "on-secondary": "#ffffff",
            "on-error": "#ffffff",
            "primary-fixed-dim": "#adc6ff",
            "on-surface": "#1b1b1c",
            "tertiary-fixed": "#ffdbcc",
            "primary-container": "#0070eb",
            "on-secondary-fixed": "#1a1b1f",
            "on-tertiary": "#ffffff",
            "on-background": "#1b1b1c",
            "on-tertiary-container": "#fffbff",
            "error-container": "#ffdad6",
            "surface-variant": "#e5e2e1",
            "secondary-container": "#e0dfe4"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",

          "spacing": {

            "gutter-list": "4px",

            "margin-main": "12px"

          },
          "fontSize": {
            "body-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400"}],
            "label-md": ["11px", {"lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500"}],
            "display-sm": ["20px", {"lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "600"}],

<style>
    body {
      background-color: transparent;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    
    .macos-glass {
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .apple-notes-textarea {
      background: transparent;
      border: none;
      resize: none;
      scrollbar-width: none;
      caret-color: #0070eb;
    }

    .apple-notes-textarea:focus {
      outline: none;
      box-shadow: none;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    
    .macos-btn {
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    
    .macos-btn:active {
      transform: scale(0.95);
      opacity: 0.8;
    }
  </style>
</head>
<body class="bg-[#121212]">
<!-- Background Placeholder to simulate desktop context -->
<div class="fixed inset-0 z-[-1] opacity-40">
<div class="w-full h-full bg-cover" data-alt="A moody, high-resolution desktop wallpaper featuring abstract, soft-focus gradients of deep indigo, obsidian, and ethereal violet. The lighting is low-key with a cinematic, glassmorphic feel, perfectly complementing a professional macOS-style utility application interface. The atmosphere is quiet, serene, and technologically sophisticated." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBg3MmHwHvvFfddsCRMxb_Uv4fbCHRGtqEpXkAFSBNqibFVJrnjlmFv3ii2cZyJli_YmdbRREZ7e_ieCsJu2q9x2FGIFtBAoruTpVrXESIZ5Sos7qY03NipKJlI0gEpylwltsW6TmlKqK9k8WX7s3ZCBrOAvbnkvWluMYH2r4FdFkrg2La5IS73RKuXGVXicQYgysQ_RL88tPd3-LtMaR3q-A5i2eAaS9Nxu6Z6FtQqhSnK3cphlGbQ')"></div>
</div>
<!-- State 4: Transcript Floating Panel (520x240px) -->
<main class="macos-glass w-[520px] h-[240px] rounded-xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Top Bar / Drag Handle (Implicit) -->
<header class="flex items-center justify-between px-padding-panel h-10 shrink-0 border-b border-white/5">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">description</span>
<span class="font-headline-md text-headline-md text-inverse-on-surface">Transcript</span>
</div>
<div class="flex items-center gap-1">
<span class="text-secondary font-label-md text-label-md px-2 py-0.5 bg-white/5 rounded">AI Verified</span>
</div>
</header>
<!-- Main Content Area: Editable Transcript -->
<div class="flex-1 px-padding-panel py-3 overflow-y-auto">
<textarea class="apple-notes-textarea w-full h-full font-body-md text-body-md text-inverse-on-surface/90 leading-relaxed" spellcheck="false">The quick brown fox jumps over the lazy dog. I am testing the new AI dictation tool and it seems incredibly fast and accurate.</textarea>
</div>
<!-- Bottom Actions Area -->
<footer class="h-14 shrink-0 px-padding-panel flex items-center justify-between border-t border-white/5 bg-white/5">
<div class="flex items-center gap-2">
<button class="macos-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/15 text-inverse-on-surface font-label-md text-label-md border border-white/5 shadow-sm">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
          Copy
        </button>
<button class="macos-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/15 text-inverse-on-surface font-label-md text-label-md border border-white/5 shadow-sm">
<span class="material-symbols-outlined text-[16px]">content_paste</span>
          Paste
        </button>
</div>
<div class="flex items-center gap-2">
<button class="macos-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-inverse-on-surface/70 font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]">refresh</span>
          Retry
        </button>
<button class="macos-btn flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-[16px]">close</span>
          Close
        </button>
</div>
</footer>
</main>
<script>
    // Micro-interactions for button active states and focus
    document.querySelectorAll('.macos-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Mock feedback
        console.log('Action triggered: ' + btn.innerText.trim());
      });
    });

    // Auto-focus textarea on load
    window.addEventListener('DOMContentLoaded', () => {
      const textarea = document.querySelector('textarea');
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    });
  </script>
</body></html>
